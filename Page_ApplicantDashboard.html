<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h2 class="mb-0">ข้อมูลผู้สมัคร</h2>
        <p class="text-muted" id="applicant-welcome-name">สวัสดี, กำลังโหลด...</p>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-6 col-lg-3">
        <div class="d-grid">
            <button class="btn btn-primary p-3" data-bs-toggle="modal" data-bs-target="#applicantInfoModal">
                <i class="bi bi-person-vcard-fill fs-3 d-block mb-2"></i>
                ข้อมูลการสมัคร
            </button>
        </div>
    </div>
    <div class="col-md-6 col-lg-3">
        <div class="d-grid">
             <button class="btn btn-info p-3" data-bs-toggle="modal" data-bs-target="#examInfoModal">
                <i class="bi bi-calendar-check-fill fs-3 d-block mb-2"></i>
                ข้อมูลการสอบ
            </button>
        </div>
    </div>
    <div class="col-md-6 col-lg-3">
        <div class="d-grid">
             <button class="btn btn-warning p-3" data-bs-toggle="modal" data-bs-target="#scoreInfoModal">
                <i class="bi bi-clipboard-data-fill fs-3 d-block mb-2"></i>
                ผลคะแนนสอบ
            </button>
        </div>
    </div>
    <div class="col-md-6 col-lg-3">
        <div class="d-grid">
            <button id="btnPrintCert" class="btn btn-success p-3">
              <i class="bi bi-patch-check-fill fs-3 d-block mb-2"></i>
              ดาวน์โหลดเกียรติบัตร
            </button>
        </div>
    </div>
</div>
