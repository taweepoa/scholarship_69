<script>
    // --- Global Variables ---
    let allApplicantData = [];
    let statsTable, adminTable;
    let dropdownOptions = {};
    let uploadedFiles = [];
    let typeChartInstance, gradeChartInstance, schoolChartInstance;
    let appConfig = {};

    // --- Utility Functions ---
    const showLoader = () => $('#loader').show();
    const hideLoader = () => $('#loader').hide();
    
    function showPage(pageId, data = null) {
        showLoader();
        
        // 1. ซ่อนทุกหน้าก่อน (สำคัญ: ต้องแน่ใจว่า div หน้าใหม่มี class="page-content" ด้วย)
        $('.page-content').addClass('d-none');
        
        // 2. แสดงหน้าเป้าหมาย
        $('#page-' + pageId).removeClass('d-none');
        
        window.scrollTo(0, 0);

        if (pageId === 'stats') {
            loadStatsPage(); // ฟังก์ชันนี้มีการปิด Loader ในตัว (ผ่าน Google Script run)
        } else if (pageId === 'admin-dashboard') {
            loadAdminDashboard(); // ฟังก์ชันนี้มีการปิด Loader ในตัว
        } else if (pageId === 'applicant-dashboard') {
            loadApplicantDashboard(data); // ฟังก์ชันนี้มีการปิด Loader ในตัว
        } else if (pageId === 'exam-stats') {
            // --- ✅ เพิ่มเคสสำหรับหน้าสถิติผลการสอบ ---
            renderPublicExamStats(); 
            
            updateNavButtons();
            $('#admin-fab').show(); 
            hideLoader(); // ⚠️ สำคัญ: ต้องสั่งปิด Loader เอง เพราะข้อมูลมีอยู่แล้ว ไม่ต้องรอ Server
        } else {
            // --- ✅ กรณีหน้าแรก (Home) และหน้าอื่นๆ ---
            updateNavButtons();
            $('#admin-fab').show();
            hideLoader(); // ✅ สำคัญ: บรรทัดนี้ทำให้หน้าแรกหายหมุน
        }
    }

    function updateNavButtons(isLoggedIn = false, page = 'home') {
        const nav = $('#nav-buttons');
        nav.empty();
        if (isLoggedIn) {
            if (page === 'admin') {
                 nav.html(`<button class="btn btn-danger" onclick="logoutAdmin()"><i class="bi bi-box-arrow-right me-1"></i>ออกจากระบบ</button>`);
            } else {
                 nav.html(`<button class="btn btn-danger" onclick="logoutApplicant()"><i class="bi bi-box-arrow-right me-1"></i>ออกจากระบบ</button>`);
            }
        } else {
            nav.html(`
                <button class="btn btn-sm btn-outline-primary me-2" data-bs-toggle="modal" data-bs-target="#applicantLoginModal">เข้าสู่ระบบ</button>
                <button class="btn btn-sm btn-primary apply-button-check">สมัครสอบ</button>
            `);
        }
    }

    function formatThaiDateTime(date) {
      if (!date || !(date instanceof Date)) return 'N/A';
      const options = {
        year: 'numeric',
        month: 'long',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
        timeZone: 'Asia/Bangkok' // บังคับเวลาไทย
      };
      return date.toLocaleDateString('th-TH', options) + ' น.';
    }

    function displayApplicationDates() {
      const banner = $('#date-display-banner');
      const startString = appConfig.application_start_date;
      const deadlineString = appConfig.application_deadline;

      if (startString && deadlineString) {
        const startDate = new Date(startString);
        const deadline = new Date(deadlineString);
        const now = new Date();

        let text = `<strong>กำหนดการ:</strong> เปิดรับสมัคร ${formatThaiDateTime(startDate)} ถึง ${formatThaiDateTime(deadline)}`;
        let alertClass = 'alert-primary'; // สีฟ้า (ปกติ)

        // ตรวจสอบสถานะ
        if (now > deadline) {
          alertClass = 'alert-danger'; // สีแดง (ปิดแล้ว)
          text = `<strong>การรับสมัคร:</strong> สิ้นสุดการรับสมัครแล้ว`;
        } else if (now < startDate) {
          alertClass = 'alert-warning'; // สีเหลือง (ยังไม่เปิด)
          text = `<strong>การรับสมัคร:</strong> ยังไม่เปิดรับสมัคร (เริ่ม ${formatThaiDateTime(startDate)})`;
        }

        banner.removeClass('alert-primary alert-danger alert-warning').addClass(alertClass);
        banner.html(text).show();
      } else {
        banner.hide();
      }
    }
    
    function getStatusBadge(status) {
        if (status === 'ตรวจสอบแล้ว') {
            return `<span class="badge bg-success">${status}</span>`;
        } else if (status === 'ยังไม่ได้ตรวจสอบ') {
            return `<span class="badge bg-warning text-dark">${status}</span>`;
        }
        return `<span class="badge bg-secondary">${status || 'N/A'}</span>`;
    }

    // --- Initialization ---
    $(document).ready(function() {
        showLoader();
        google.script.run
            .withSuccessHandler(response => {
                if (response.success) {
                    dropdownOptions = response.dropdowns;
                    appConfig = response.config;
                    
                    appConfig.stats = {};
                    if (response.stats) {
                        Object.keys(response.stats).forEach(key => {
                            try { appConfig.stats[key] = JSON.parse(response.stats[key]); } catch(e){}
                        });
                    }

                    populateDropdowns();
                    displayApplicationDates();
                    // Check login status from session storage
                    const applicantId = sessionStorage.getItem('applicantCitizenID');
                    const adminLoggedIn = sessionStorage.getItem('adminLoggedIn');

                    if (adminLoggedIn === 'true') {
                        showPage('admin-dashboard');
                    } else if (applicantId) {
                        showPage('applicant-dashboard', applicantId);
                    } else {
                        showPage('home');
                    }
                } else {
                    Swal.fire('Error', response.message, 'error');
                }
            })
            .withFailureHandler(err => Swal.fire('Error', err.message, 'error'))
            .getInitialData();
    });

    function populateDropdowns() {
        // Registration form dropdowns
        $('#ScholarshipType').html('<option selected disabled value="">-- เลือกประเภททุน --</option>' + dropdownOptions.ScholarshipType.map(o => `<option value="${o}">${o}</option>`).join(''));
        $('#StudentPrefix').html('<option selected disabled value="">-- เลือก --</option>' + dropdownOptions.StudentPrefix.map(o => `<option value="${o}">${o}</option>`).join(''));
        $('#StudentGrade').html('<option selected disabled value="">-- เลือก --</option>' + dropdownOptions.StudentGrade.map(o => `<option value="${o}">${o}</option>`).join(''));
        $('#AdvisorPrefix').html('<option selected disabled value="">-- เลือก --</option>' + dropdownOptions.AdvisorPrefix.map(o => `<option value="${o}">${o}</option>`).join(''));
    }

    // --- Page Loaders ---
    function loadApplicantData(callback) {
         if (allApplicantData.length > 0) {
             callback();
             return;
         }
         google.script.run
            .withSuccessHandler(response => {
                if(response.success){
                    allApplicantData = response.data;
                    callback(response);
                } else {
                    Swal.fire('Error', response.message, 'error');
                    hideLoader();
                }
            })
            .withFailureHandler(err => {
                Swal.fire('Error', err.message, 'error');
                hideLoader();
            })
            .getApplicantData();
    }
    
    function loadStatsPage() {
        updateNavButtons();
        $('#admin-fab').show();
        loadApplicantData((response) => {
            // --- 1. Dashboard Cards ---
            const total = allApplicantData.length;
            const m1 = allApplicantData.filter(d => d.ScholarshipType === 'ทุนระดับชั้นมัธยมศึกษาปีที่ 1').length;
            const m4 = allApplicantData.filter(d => d.ScholarshipType === 'ทุนระดับชั้นมัธยมศึกษาปีที่ 4').length;
            $('#stats-total').text(total);
            $('#stats-m1').text(m1);
            $('#stats-m4').text(m4);

            // --- 2. Process Data for Charts ---
            const processData = (key) => allApplicantData.reduce((acc, item) => {
                const value = item[key] || 'ไม่ระบุ';
                acc[value] = (acc[value] || 0) + 1;
                return acc;
            }, {});

            const typeCounts = processData('ScholarshipType');
            const gradeCounts = processData('StudentGrade');
            const schoolCounts = processData('School');

            const sortedSchools = Object.entries(schoolCounts).sort(([,a],[,b]) => b-a).slice(0, 10);
            const schoolLabels = sortedSchools.map(item => item[0]);
            const schoolData = sortedSchools.map(item => item[1]);

            // --- 3. Create Charts ---
            const chartColors = ['#5677fc', '#D32F2F', '#F57C00', '#0288D1', '#388E3C', '#FBC02D', '#673AB7'];
            Chart.defaults.font.family = "'Kanit', sans-serif";

            if(typeChartInstance) typeChartInstance.destroy();
            if(gradeChartInstance) gradeChartInstance.destroy();
            if(schoolChartInstance) schoolChartInstance.destroy();

            typeChartInstance = new Chart($('#typeChart'), {
                type: 'doughnut',
                data: { labels: Object.keys(typeCounts), datasets: [{ data: Object.values(typeCounts), backgroundColor: chartColors }] },
                options: { responsive: true, plugins: { legend: { position: 'top' } } }
            });

            gradeChartInstance = new Chart($('#gradeChart'), {
                type: 'pie',
                data: { labels: Object.keys(gradeCounts), datasets: [{ data: Object.values(gradeCounts), backgroundColor: chartColors }] },
                options: { responsive: true, plugins: { legend: { position: 'top' } } }
            });

            schoolChartInstance = new Chart($('#schoolChart'), {
                type: 'bar',
                data: { labels: schoolLabels, datasets: [{ 
                    label: 'จำนวนผู้สมัคร', 
                    data: schoolData, 
                    backgroundColor: chartColors,
                    borderColor: chartColors,
                    borderWidth: 1
                }] },
                options: { 
                    indexAxis: 'y',
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } }
                }
            });

            // --- 4. Data Table ---
            $('#stats-filter-type').html('<option value="">ทุกประเภททุน</option>' + dropdownOptions.ScholarshipType.map(o => `<option value="${o}">${o}</option>`).join(''));
            $('#stats-filter-grade').html('<option value="">ทุกระดับชั้น</option>' + [...new Set(allApplicantData.map(item => item.StudentGrade))].sort().map(g => `<option value="${g}">${g}</option>`).join(''));
            $('#stats-filter-school').html('<option value="">ทุกโรงเรียน</option>' + [...new Set(allApplicantData.map(item => item.School))].sort().map(s => `<option value="${s}">${s}</option>`).join(''));

            if ($.fn.DataTable.isDataTable('#stats-table')) {
                statsTable.clear().rows.add(allApplicantData).draw();
            } else {
                statsTable = $('#stats-table').DataTable({
                    data: allApplicantData,
                    responsive: true,
                    columns: [
                        { data: null, render: (data, type, row, meta) => meta.row + 1, "title": "ลำดับ" },
                        { data: null, render: data => `${data.StudentPrefix}${data.StudentFirstName} ${data.StudentLastName}`, "title": "ชื่อ-นามสกุล" },
                        { data: 'StudentGrade', "title": "ระดับชั้น" },
                        { data: 'School', "title": "โรงเรียน" },
                        { 
                            data: 'ScholarshipType', 
                            "title": "ประเภททุน",
                            render: function(data) {
                                if (!data) return '-';
                                // เปลี่ยนจาก "ทุนระดับชั้นมัธยมศึกษาปีที่ X" เป็น "ทุน ม.X"
                                return data.replace('ทุนระดับชั้นมัธยมศึกษาปีที่', 'ทุน ม.');
                            }
                        },
                        { 
                            data: 'ExamSeat', 
                            "title": "เลขที่นั่งสอบ",
                            render: (data) => data ? `<span class="fw-bold text-primary">${data}</span>` : '<span class="text-muted small">-</span>'
                        },
                        { 
                            data: 'ExamRoom', 
                            "title": "ห้องสอบ",
                            render: (data) => data ? data : '<span class="text-muted small">-</span>'
                        },
                        { data: 'Status', render: data => getStatusBadge(data), "title": "สถานะ" }
                    ],
                    language: { url: '//cdn.datatables.net/plug-ins/2.0.3/i18n/th.json' }
                });
            }
            hideLoader();
        });
    }

    function loadAdminDashboard() {
        console.log("Starting loadAdminDashboard..."); // Debug 1
        updateNavButtons(true, 'admin');
        $('#admin-fab').hide();
        
        google.script.run
            .withSuccessHandler(response => {
                console.log("Server responded:", response); // Debug 2: ดูข้อมูลที่ได้จาก Server

                if (response.success) {
                    // 1. ลองเก็บข้อมูลผู้สมัคร
                    try {
                        allApplicantData = response.applicants || [];
                        console.log("Applicants loaded:", allApplicantData.length);
                    } catch (e) {
                        console.error("Error processing applicants:", e);
                    }

                    // 2. ลองแปลงข้อมูล Stats (จุดนี้มักพลาดบ่อย)
                    try {
                        appConfig.stats = {};
                        if (response.stats) {
                            Object.keys(response.stats).forEach(key => {
                                try { 
                                    appConfig.stats[key] = JSON.parse(response.stats[key]); 
                                } catch(jsonErr) {
                                    console.warn("Cannot parse JSON for key:", key, jsonErr);
                                }
                            });
                        }
                        console.log("Stats processed");
                    } catch (e) {
                        console.error("Error processing stats:", e);
                    }
                    
                    // 3. ลองสร้างตารางผู้สมัคร
                    try {
                        console.log("Rendering Applicant Table...");
                        renderAdminApplicantsTable(); 
                        console.log("Applicant Table Rendered");
                    } catch (e) {
                        console.error("Error rendering admin table:", e);
                        Swal.fire('Table Error', 'ไม่สามารถแสดงตารางผู้สมัครได้: ' + e.message, 'warning');
                    }
                    
                    // 4. ลองเติมข้อมูลวันที่ในฟอร์ม
                    try {
                        if(response.config && response.config.application_start_date) {
                            $('#admin_start_date').val(response.config.application_start_date.substring(0, 16));
                        }
                        if(response.config && response.config.application_deadline) {
                            $('#admin_deadline').val(response.config.application_deadline.substring(0, 16));
                        }
                    } catch (e) {
                        console.error("Error setting dates:", e);
                    }

                    // ✅ สำคัญที่สุด: ปิด Loader เสมอ ไม่ว่าจะเกิดอะไรขึ้นข้างบน
                    hideLoader(); 

                } else {
                    console.error("Server returned success: false", response.message);
                    Swal.fire('Error', response.message, 'error');
                    hideLoader();
                }
            })
            .withFailureHandler(err => {
                console.error("Server Failure:", err);
                hideLoader();
                Swal.fire('Critical Error', err.message, 'error');
            })
            .getAdminData();
    }

    function renderAdminApplicantsTable() {
        // 1. ตรวจสอบและทำลายตารางเก่า
        if ($.fn.DataTable.isDataTable('#admin-table')) {
            $('#admin-table').DataTable().destroy();
        }

        // 2. สร้างตารางใหม่
        $('#admin-table').DataTable({
            data: allApplicantData,
            responsive: true,
            columns: [
                { title: "ลำดับ", data: null, render: function(data, type, row, meta) { return meta.row + 1; } },
                { title: "ชื่อ-สกุล", data: null, render: function(data) { return data.StudentFirstName + ' ' + data.StudentLastName; } },
                { title: "โรงเรียน", data: 'School' },
                { title: "ประเภททุน", data: 'ScholarshipType' },
                { title: "เบอร์โทร", data: 'StudentPhone' },
                { 
                    title: "สลิป", 
                    data: 'SlipFileIDs', 
                    render: function(ids) {
                        // ใช้เครื่องหมาย ' หรือ " ธรรมดาแทน Backtick เพื่อลดความเสี่ยง
                        if(ids) return '<button class="btn btn-sm btn-info" onclick="viewSlips(\'' + ids + '\')"><i class="bi bi-eye"></i></button>';
                        return '-';
                    }
                },
                { title: "สถานะ", data: 'Status', render: function(data) { return getStatusBadge(data); } },
                { 
                    title: "จัดการ",
                    data: null, 
                    render: function(data) {
                        // ตรงนี้ใช้ Backtick (`) จำเป็นต้องระวังห้ามลบ
                        return `<div class="btn-group btn-group-sm">
                            <button class="btn btn-primary view-applicant-details-btn" data-citizen-id="${data.CitizenID}" title="ดูรายละเอียด"><i class="bi bi-search"></i></button>
                            <button class="btn btn-success" onclick="updateStatus('${data.CitizenID}', 'ตรวจสอบแล้ว')" title="อนุมัติ"><i class="bi bi-check-lg"></i></button>
                            <button class="btn btn-warning" onclick="updateStatus('${data.CitizenID}', 'ยังไม่ได้ตรวจสอบ')" title="รอตรวจสอบ"><i class="bi bi-x-lg"></i></button>
                        </div>`;
                    }
                }
            ],
            language: { url: '//cdn.datatables.net/plug-ins/2.0.3/i18n/th.json' }
        });
    }

    function renderIndividualScores() {
        // 1. สร้าง Dropdown และปุ่ม Download
        const types = [...new Set(allApplicantData.map(d => d.ScholarshipType))].sort();
        
        // หาค่าเริ่มต้นที่เป็น "ทุน ม.1" (ค้นหาคำว่า "มัธยมศึกษาปีที่ 1")
        const defaultType = types.find(t => t.includes('มัธยมศึกษาปีที่ 1')) || '';

        // เช็คว่าเคยสร้าง Toolbar ไปหรือยัง
        if ($('#indv-score-actions').length === 0) {
            const header = $('#indv-score-filter').closest('.card-header');
            header.empty(); 
            
            const toolbarHtml = `
                <div class="d-flex justify-content-between align-items-center w-100">
                    <h5 class="mb-0">คะแนนรายบุคคล</h5>
                    <div class="d-flex gap-2" id="indv-score-actions">
                        <select id="indv-score-filter" class="form-select form-select-sm" style="width: auto; min-width: 150px;">
                            <option value="">ทั้งหมด</option>
                            ${types.map(t => `<option value="${t}">${t}</option>`).join('')}
                        </select>
                        <button class="btn btn-success btn-sm" onclick="downloadIndividualScores()">
                            <i class="bi bi-file-earmark-excel-fill me-1"></i> ดาวน์โหลด Excel
                        </button>
                    </div>
                </div>
            `;
            header.html(toolbarHtml);

            // Bind Event ให้ Dropdown
            $('#indv-score-filter').on('change', function() {
                const val = $(this).val();
                const table = $('#indv-score-table').DataTable();
                table.column(3).search(val).draw();
            });
            
            // ✅ ตั้งค่าเริ่มต้น Dropdown
            if (defaultType) {
                $('#indv-score-filter').val(defaultType);
            }
        }

        // 2. ตรวจสอบและทำลายตารางเก่า
        if ($.fn.DataTable.isDataTable('#indv-score-table')) {
            $('#indv-score-table').DataTable().destroy();
        }
        
        // 3. สร้างตารางใหม่ (ปรับลำดับคอลัมน์)
        const table = $('#indv-score-table').DataTable({
            data: allApplicantData,
            responsive: true,
            pageLength: 20,
            columns: [
                { 
                    data: 'Rank_Total', 
                    title: "อันดับที่", 
                    className: "text-center fw-bold",
                    render: (d, type) => {
                        if (type === 'sort') return Number(d) || 999999;
                        return d || '-'; 
                    }
                },
                { 
                    data: 'Rank_Elephant', 
                    title: "อันดับทุน", 
                    className: "text-center",
                    render: d => (d && d !== '-' && d !== '') ? `<span class="badge bg-warning text-dark rounded-pill">${d}</span>` : '-' 
                },
                { 
                    data: null, 
                    title: "ชื่อ-สกุล", 
                    render: d => `<span class="fw-bold">${d.StudentFirstName} ${d.StudentLastName}</span>` 
                },
                { data: 'ScholarshipType', title: "ประเภททุน", visible: false }, // Index 3
                
                // --- ✅ ปรับลำดับคะแนน: สังคม > ไทย > อังกฤษ > วิทย์ > คณิต ---
                { data: 'Soc_Score',  title: "สังคม", className: "text-end", render: d => Number(d).toFixed(2) },
                { data: 'Thai_Score', title: "ไทย", className: "text-end", render: d => Number(d).toFixed(2) },
                { data: 'Eng_Score',  title: "อังกฤษ", className: "text-end", render: d => Number(d).toFixed(2) },
                { data: 'Sci_Score',  title: "วิทย์", className: "text-end", render: d => Number(d).toFixed(2) },
                { data: 'Math_Score', title: "คณิต", className: "text-end", render: d => Number(d).toFixed(2) },

                // คะแนนรวม
                { 
                    data: 'TotalScore', 
                    title: "รวม", 
                    className: "text-end table-active fw-bold text-primary", 
                    render: d => Number(d).toFixed(2) 
                },
                { 
                    data: 'Certificate', 
                    title: "เกียรติบัตร",
                    className: "text-center", 
                    render: d => {
                        if (!d || d === 'ขาดสอบ') return '<span class="badge bg-secondary">ขาดสอบ</span>';
                        if (d === 'เหรียญทอง') return `<span class="badge rounded-pill" style="background-color: #FFD700; color: #000; border: 1px solid #E5C100;"><i class="bi bi-trophy-fill"></i> เหรียญทอง</span>`;
                        if (d === 'เหรียญเงิน') return `<span class="badge rounded-pill" style="background-color: #C0C0C0; color: #000; border: 1px solid #AAAAAA;"><i class="bi bi-trophy-fill"></i> เหรียญเงิน</span>`;
                        if (d === 'เหรียญทองแดง') return `<span class="badge rounded-pill" style="background-color: #CD7F32; color: #fff; border: 1px solid #A0522D;"><i class="bi bi-trophy-fill"></i> เหรียญทองแดง</span>`;
                        if (d === 'ชมเชย') return `<span class="badge rounded-pill bg-info text-dark"><i class="bi bi-hand-thumbs-up-fill"></i> ชมเชย</span>`;
                        return d;
                    }
                },
                { 
                    data: null, 
                    title: "จัดการ", 
                    className: "text-center text-nowrap", // เพิ่ม text-nowrap เพื่อไม่ให้ปุ่มตกบรรทัด
                    orderable: false,
                    render: d => {

                                    beginAtZero: true,

    // ฟังก์ชันแสดงผล "วิเคราะห์โรงเรียน" (ปรับปรุง: มีตัวกรองแยกประเภททุน)
    function renderSchoolCharts() {
        // 1. เตรียมพื้นที่และตัวกรอง
        const container = $('#tab-school-analysis'); // ตรวจสอบ ID ให้ตรงกับ HTML
        
        // ดึงประเภททุนทั้งหมดที่มี
        const types = [...new Set(allApplicantData.map(d => d.ScholarshipType))];
        
        // สร้างส่วนหัวและ Dropdown เลือกประเภททุน (ถ้ายังไม่มี)
        if ($('#school-filter-container').length === 0) {
            // หา Card Header ของกราฟเพื่อแทรก Dropdown
            // เราจะแทรก HTML ตัวกรองเข้าไปก่อนกราฟ
            const filterHtml = `
                <div id="school-filter-container" class="row mb-4 align-items-center">
                    <div class="col-md-auto">
                        <label class="fw-bold"><i class="bi bi-funnel-fill me-2"></i>เลือกประเภททุน:</label>
                    </div>
                    <div class="col-md-4">
                        <select id="school-analysis-filter" class="form-select">
                            <option value="all">ทั้งหมด (รวมทุกระดับชั้น)</option>
                            ${types.map(t => `<option value="${t}">${t}</option>`).join('')}
                        </select>
                    </div>
                </div>
            `;
            // แทรกไว้บนสุดของ Tab นี้
            container.prepend(filterHtml);

            // เพิ่ม Event Listener เมื่อเปลี่ยนค่า Dropdown
            $('#school-analysis-filter').on('change', function() {
                updateSchoolData($(this).val());
            });
        }

        // เรียกทำงานครั้งแรก (แสดงทั้งหมด)
        updateSchoolData('all');
    }

    // ฟังก์ชันย่อยสำหรับคำนวณและวาดกราฟใหม่ตามตัวกรอง (อัปเดต: แสดงจำนวนผู้เข้าสอบ)
    function updateSchoolData(selectedType) {
        // 1. กรองข้อมูล (เอาเฉพาะคนที่มาสอบ)
        let filteredData = allApplicantData.filter(d => {
            const isPresent = Number(d.TotalScore) > 0 || String(d.Status) === 'TRUE'; 
            if (!isPresent) return false;
            if (selectedType !== 'all' && d.ScholarshipType !== selectedType) return false;
            return true;
        });

        // 2. คำนวณค่าสถิติแยกรายโรงเรียน
        const schoolMap = {};
        
        filteredData.forEach(s => {
            const schoolName = s.School || 'ไม่ระบุ';
            if (!schoolMap[schoolName]) {
                schoolMap[schoolName] = { 
                    name: schoolName, 
                    sumScore: 0, 
                    count: 0, 
                    goldCount: 0 
                };
            }
            schoolMap[schoolName].sumScore += Number(s.TotalScore);
            schoolMap[schoolName].count++; // นับจำนวนผู้เข้าสอบ
            if (s.Certificate === 'เหรียญทอง') {
                schoolMap[schoolName].goldCount++;
            }
        });

        let schoolList = Object.values(schoolMap).map(item => ({
            name: item.name,
            avg: item.count ? (item.sumScore / item.count) : 0,
            gold: item.goldCount,
            count: item.count // เก็บค่าจำนวนคน
        }));

        // --- ส่วนที่ 1: กราฟ Top 10 ---
        const top10 = [...schoolList].sort((a, b) => b.avg - a.avg).slice(0, 10);
        
        const chartCanvas = document.getElementById('schoolTop10Chart');
        if (window.schoolChartInstance) {
            window.schoolChartInstance.destroy();
        }

        window.schoolChartInstance = new Chart(chartCanvas, {
            type: 'bar',
            data: {
                labels: top10.map(s => s.name),
                datasets: [{
                    label: 'คะแนนเฉลี่ยรวม',
                    data: top10.map(s => s.avg.toFixed(2)),
                    backgroundColor: 'rgba(54, 162, 235, 0.7)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1,
                    // ✅ แอบส่งข้อมูลจำนวนคนเข้าไปใน dataset เพื่อใช้แสดงใน Tooltip
                    counts: top10.map(s => s.count) 
                }]
            },
            options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                scales: { x: { beginAtZero: true, title: { display: true, text: 'คะแนนเฉลี่ย (เต็ม 500)' } } },
                plugins: {
                    legend: { display: false },
                    title: { 
                        display: true, 
                        text: `10 อันดับโรงเรียนที่มีคะแนนเฉลี่ยสูงสุด (${selectedType === 'all' ? 'ทุกระดับชั้น' : selectedType})`,
                        font: { size: 16 }
                    },
                    tooltip: {
                        callbacks: {
                            // ✅ ปรับ Tooltip ให้โชว์จำนวนคนด้วย
                            label: function(context) {
                                let label = context.dataset.label || '';
                                if (label) {
                                    label += ': ';
                                }
                                if (context.parsed.x !== null) {
                                    label += context.parsed.x;
                                }
                                // ดึงข้อมูลจำนวนคนที่เราแอบส่งมา
                                const count = context.dataset.counts[context.dataIndex];
                                return `${label} (จำนวนผู้เข้าสอบ: ${count} คน)`;
                            }
                        }
                    }
                }
            }
        });

        // --- ส่วนที่ 2: ตารางโรงเรียนที่เป็นเลิศ ---
        const goldSchools = schoolList
            .filter(s => s.gold > 0)
            .sort((a, b) => {
                if (b.gold !== a.gold) return b.gold - a.gold;
                return b.avg - a.avg;
            });

        const tbody = $('#school-excellence-table tbody');
        tbody.empty();

        if (goldSchools.length === 0) {
            tbody.html('<tr><td colspan="5" class="text-center text-muted p-3">ไม่พบโรงเรียนที่ได้รับเหรียญทองในเกณฑ์นี้</td></tr>');
        } else {
            goldSchools.forEach((s, i) => {
                // ✅ เพิ่มคอลัมน์ s.count (จำนวนผู้เข้าสอบ)
                tbody.append(`
                    <tr>
                        <td class="text-center">${i + 1}</td>
                        <td>${s.name}</td>
                        <td class="text-center">${s.count}</td> <td class="text-center fw-bold text-success fs-5">${s.gold}</td>
                        <td class="text-center text-primary fw-bold">${s.avg.toFixed(2)}</td>
                    </tr>
                `);
            });
        }
        
        $('#school-excellence-table').prev().find('h5').text(`โรงเรียนที่เป็นเลิศด้านวิชาการ (${selectedType === 'all' ? 'รวมทุกระดับชั้น' : selectedType})`);
    }

    // ฟังก์ชันโหลดหน้า Dashboard ผู้สมัคร (รวมตารางสอบเดิม + สถิติใหม่)
function loadApplicantDashboard(incomingData) {
    console.log("Dashboard Incoming Data:", incomingData);

    let student, stats;

    // 1. ตรวจสอบโครงสร้างข้อมูล
    if (incomingData && incomingData.data) {
        student = incomingData.data;
        stats = incomingData.stats;
    } else {
        student = incomingData;
        stats = null;
    }

    if (!student || !student.StudentPrefix) {
        Swal.fire('Error', 'ไม่สามารถโหลดข้อมูลนักเรียนได้', 'error');
        hideLoader();
        return;
    }

    currentUserData = student; 
    updateNavButtons(true, 'applicant');
    $('#admin-fab').hide();

    // อัปเดตข้อความต้อนรับ (เช่น ที่ Navbar หรือหัวหน้าเว็บ)

    if ($('#applicant-welcome-name').length > 0) {
        $('#applicant-welcome-name').text(`สวัสดี, ${student.StudentPrefix}${student.StudentFirstName} ${student.StudentLastName}`);
    }

    // 2. แสดงข้อมูลส่วนตัว (Header)
    $('#applicant-info-content').html(`
        <div class="row">
            <div class="col-md-8">
                <h4 class="text-primary fw-bold">ยินดีต้อนรับ, ${student.StudentPrefix}${student.StudentFirstName} ${student.StudentLastName}</h4>
                <p class="mb-1"><strong>ระดับชั้น:</strong> ${student.StudentGrade} | <strong>โรงเรียน:</strong> ${student.School}</p>
                <p class="mb-1"><strong>ประเภททุน:</strong> ${student.ScholarshipType}</p>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                 <div class="p-3 bg-light border rounded">
                    <small class="text-muted d-block">สถานะการสมัคร</small>
                    ${getStatusBadge(student.Status)}
                 </div>
            </div>
        </div>
    `);

    // --- ✅ 3. ส่วนแสดงข้อมูลการสอบ (ตารางสอบแบบเดิม) ---
    // ใช้ Selector ที่ถูกต้องใน Modal หรือหน้าเว็บของคุณ (เช่น #exam-info-content)
    // *หมายเหตุ: ตรวจสอบว่าใน HTML ของ Modal ข้อมูลการสอบ มี div id="exam-info-content" อยู่*
    const examInfoContainer = $('#exam-info-content'); // หรือ selector ที่คุณใช้สำหรับ Modal ข้อมูลการสอบ
    
    if (examInfoContainer.length > 0) {
        examInfoContainer.empty(); // เคลียร์ของเก่า

        if (student.ExamSeat && student.ExamRoom) {
            // โค้ด HTML เดิมที่คุณต้องการ
            const examHtml = `
                <div class="text-center mb-4">
                    <h5 class="fw-bold">${student.StudentPrefix}${student.StudentFirstName} ${student.StudentLastName}</h5>
                    <p class="mb-0"><strong>วันที่สอบ:</strong> ${student.ExamSchedule || 'รอประกาศ'}</p>
                    <div class="d-flex justify-content-center gap-4 mt-2">
                        <span><strong>เลขที่นั่งสอบ:</strong> <span class="badge bg-primary fs-6">${student.ExamSeat}</span></span>
                        <span><strong>ห้องสอบ:</strong> <span class="badge bg-primary fs-6">${student.ExamRoom}</span></span>
                    </div>
                </div>
                <hr>
                <h5 class="text-center mb-3 fw-bold">ตารางสอบ</h5>
                <div class="table-responsive">
                    <table class="table table-bordered text-center align-middle">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 35%;">เวลา</th>
                                <th style="width: 30%;">จำนวนเวลา</th>
                                <th>วิชา</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td>08.30 - 09.30 น.</td><td>1 ชั่วโมง</td><td>คณิตศาสตร์</td></tr>
                            <tr class="table-secondary"><td colspan="3" class="py-2">พัก 15 นาที</td></tr>
                            <tr><td>09.45 - 10.45 น.</td><td>1 ชั่วโมง</td><td>ภาษาไทย</td></tr>
                            <tr class="table-secondary"><td colspan="3" class="py-2">พัก 15 นาที</td></tr>
                            <tr><td>11.00 - 12.00 น.</td><td>1 ชั่วโมง</td><td>ภาษาอังกฤษ</td></tr>

                            <tr><td>13.00 - 14.00 น.</td><td>1 ชั่วโมง</td><td>วิทยาศาสตร์และเทคโนโลยี</td></tr>

    // 4. แสดงผลคะแนนสอบ (Result Section - แบบใหม่)
    const scoreContainer = $('#score-info-content');
    scoreContainer.empty();

        if (passwordInput.attr('type') === 'password') {
            passwordInput.attr('type', 'text');
            icon.removeClass('bi-eye-slash').addClass('bi-eye');
        } else {
            passwordInput.attr('type', 'password');
            icon.removeClass('bi-eye').addClass('bi-eye-slash');
        }
    });

    $(document).on('click', '.toggle-password-btn', function() {
        const button = $(this);
        // หา input ที่อยู่ภายใน input-group เดียวกัน
        const passwordInput = button.closest('.input-group').find('input');
        const icon = button.find('i');

        // สลับประเภทของ input และเปลี่ยนไอคอน
        if (passwordInput.attr('type') === 'password') {

    // ป้องกันการกด 'Enter' ไม่ให้ Submit ฟอร์ม (ยกเว้นขั้นตอนสุดท้าย)
    $('#registerForm').on('keydown', function(e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
            
            // ตรวจสอบว่าเรา 'ไม่ได้' อยู่ในขั้นตอนสุดท้ายหรือไม่
            if (currentStep !== ($(".form-step").length - 1)) {
                
                // 1. ป้องกันไม่ให้ฟอร์มถูก Submit
                e.preventDefault();
                
                // 2. (ทางเลือก) สั่งให้ทำงานเหมือนคลิกปุ่ม "ถัดไป"
                //    เพื่อตรวจสอบข้อมูลและไปหน้าถัดไป
                $('#nextBtn').click();
            }
        }
    });

    // จัดการการคลิกปุ่มสมัครสอบ เพื่อตรวจสอบวันปิดรับสมัคร
    $(document).on('click', '.apply-button-check', function() {
        showLoader();

        const startString = appConfig.application_start_date;
        const deadlineString = appConfig.application_deadline;
        const now = new Date();

        // --- 1. ตรวจสอบว่าเปิดหรือยัง ---
        if (startString) {
            const startDate = new Date(startString);
            if (now < startDate) {
                hideLoader();
                Swal.fire({
                    icon: 'info',
                    title: 'ยังไม่เปิดรับสมัคร',
                    text: `ระบบจะเปิดรับสมัครในวันที่ ${formatThaiDateTime(startDate)}`,
                });
                return; // หยุดทำงาน
            }
        }

        // --- 2. ตรวจสอบว่าปิดหรือยัง ---
        if (deadlineString) {
            const deadline = new Date(deadlineString);
            if (now > deadline) {
                hideLoader();
                Swal.fire({
                    icon: 'warning',
                    title: 'หมดเวลา',
                    text: 'ระบบได้ปิดรับสมัครสอบแล้ว',
                });
                return; // หยุดทำงาน
            }
        }

        // --- 3. ถ้าผ่านทั้งหมด ให้เปิดหน้าสมัคร ---
        hideLoader();
        $('#registerModal').modal('show');
    });
    
    $(document).on('click', '#saveSettingsBtn', function() {
      showLoader();
      const settings = {
        application_start_date: $('#admin_start_date').val(),
        application_deadline: $('#admin_deadline').val()
      };

      // แปลงเป็น ISO String เพื่อส่งไปให้ backend
      // (ป้องกันปัญหา Timezone เพี้ยน)
      settings.application_start_date = new Date(settings.application_start_date).toISOString();
      settings.application_deadline = new Date(settings.application_deadline).toISOString();

      google.script.run
        .withSuccessHandler(response => {
          hideLoader();
          if (response.success) {
            // อัปเดตค่า config ในหน้าเว็บทันที
            appConfig.application_start_date = settings.application_start_date;
            appConfig.application_deadline = settings.application_deadline;

            Swal.fire('สำเร็จ!', response.message, 'success');

            // อัปเดตแบนเนอร์ที่หน้าแรก (ถ้าเราอยู่ในหน้าแรก)
            displayApplicationDates(); 
          } else {
            Swal.fire('ผิดพลาด!', response.message, 'error');
          }
        })
        .withFailureHandler(err => {
          hideLoader();
          Swal.fire('ผิดพลาดรุนแรง!', err.message, 'error');
        })
        .updateAppSettings(settings);
    });

    let currentStep = 0;

    function showStep(n) {
        let steps = $(".form-step");
        if (steps.length === 0) return;
        steps.removeClass("active");
        $(steps[n]).addClass("active");

        $("#prevBtn").toggle(n > 0); // แสดงปุ่ม "ย้อนกลับ" (ถ้าไม่ใช่หน้าแรก)

        if (n == (steps.length - 1)) {
            // --- ✅ นี่คือขั้นตอนสุดท้าย (หน้าสลิป) ---
            $("#nextBtn").hide();     // ซ่อนปุ่ม "ถัดไป"
            $("#submitBtn").show();   // แสดงปุ่ม "ยืนยันการสมัคร"
        } else {
            // --- นี่คือขั้นตอนอื่นๆ (1, 2, 3) ---
            $("#nextBtn").show();     // แสดงปุ่ม "ถัดไป"
            $("#submitBtn").hide();   // ซ่อนปุ่ม "ยืนยันการสมัคร"
        }
    }

    function nextPrev(n) {
        if (n === 1 && !validateForm()) return false;
        
        let steps = $(".form-step");
        currentStep += n;

        if (currentStep >= steps.length) {
            // This is handled by form submission now
            return false;
        }
        showStep(currentStep);
    }

    function validateForm() {
        let valid = true;
        let currentStepInputs = $(".form-step.active input, .form-step.active select");
        currentStepInputs.each(function() {
            if (!this.checkValidity()) {
                $(this).addClass('is-invalid');
                valid = false;
            } else {
                 $(this).removeClass('is-invalid');
            }
        });

        return valid;
    }

    // --- File Upload Logic ---
    const dropZone = $('#drop-zone');
    const fileInput = $('#slipUpload');
    const previewContainer = $('#preview-container');

    dropZone.on('click', () => fileInput.click());
    dropZone.on('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.addClass('dragover');
    });
    dropZone.on('dragleave', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.removeClass('dragover');
    });
    dropZone.on('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropZone.removeClass('dragover');
        handleFiles(e.originalEvent.dataTransfer.files);
    });
    fileInput.on('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
        $('#drop-zone').css('border-color', '#ccc'); // Reset validation border
        for (const file of files) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const fileData = {
                    name: file.name,
                    mimeType: file.type,
                    data: e.target.result.split(',')[1] // Get base64 part
                };
                uploadedFiles.push(fileData);
                
                const previewItem = $(`
                    <div class="preview-item">
                        <img src="${e.target.result}" alt="${file.name}">
                        <button type="button" class="remove-file">&times;</button>
                    </div>
                `);
                previewItem.find('.remove-file').on('click', function() {
                    const indexToRemove = $(this).parent().index();
                    uploadedFiles.splice(indexToRemove, 1);
                    $(this).parent().remove();
                });
                previewContainer.append(previewItem);
            };
            reader.readAsDataURL(file);
        }
    }

    // 1. ดาวน์โหลด Template (แก้ไขเพิ่มเลขที่นั่งสอบและเรียงลำดับ)
    function downloadScoreTemplate() {
        // 1. เตรียมหัวตาราง (Header) - เพิ่ม ExamSeat เป็นคอลัมน์แรก
        let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; // เพิ่ม \uFEFF (BOM) เพื่อให้ Excel อ่านภาษาไทยออก
        csvContent += "ExamSeat,CitizenID,StudentName,Thai_Correct,Thai_Full,Math_Correct,Math_Full,Sci_Correct,Sci_Full,Soc_Correct,Soc_Full,Eng_Correct,Eng_Full\n";

        // 2. เรียงลำดับข้อมูลตามเลขที่นั่งสอบ (ExamSeat) ก่อน
        const sortedData = [...allApplicantData].sort((a, b) => {
            // แปลงเป็นตัวเลขเพื่อเปรียบเทียบ (ถ้าไม่มีเลขให้เป็น 999999)
            const seatA = Number(a.ExamSeat) || 999999;
            const seatB = Number(b.ExamSeat) || 999999;
            return seatA - seatB;
        });

        // 3. วนลูปข้อมูลเพื่อสร้างแถว
        sortedData.forEach(row => {
            // ดึงเลขที่นั่งสอบ (ถ้าไม่มีให้เป็นค่าว่าง)
            const seat = row.ExamSeat ? row.ExamSeat : '';
            
            // สร้างแถวข้อมูล
            // หมายเหตุ: ใส่ ' หน้า CitizenID เพื่อป้องกัน Excel แปลงเป็น Scientific Notation (1.23E+12)
            csvContent += `${seat},'${row.CitizenID},${row.StudentFirstName} ${row.StudentLastName},0,20,0,20,0,20,0,20,0,20\n`; 
        });
        
        // 4. สร้างลิงก์และสั่งดาวน์โหลด
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "Score_Template_With_Seats.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // ฟังก์ชันดาวน์โหลด Excel รายบุคคล (ปรับปรุง: เพิ่มเลขที่นั่งสอบ และเรียงคะแนนตามลำดับใหม่)
    function downloadIndividualScores() {
        showLoader();
        try {
            const wb = XLSX.utils.book_new();
            let hasData = false;
            const types = [...new Set(allApplicantData.map(d => d.ScholarshipType))].sort();

            types.forEach(type => {
                let sheetData = allApplicantData
                    .filter(d => d.ScholarshipType === type)
                    .sort((a, b) => {
                        const rankA = Number(a.Rank_Total) || 999999;
                        const rankB = Number(b.Rank_Total) || 999999;
                        return rankA - rankB;
                    });

                if (sheetData.length > 0) {
                    hasData = true;

                    // ✅ แปลงข้อมูล (เพิ่มเลขที่นั่งสอบ และ เรียงคะแนนใหม่)
                    const excelRows = sheetData.map(d => ({
                        "ประเภททุน": d.ScholarshipType,
                        "อันดับที่": d.Rank_Total,
                        "อันดับทุน": d.Rank_Elephant,
                        "เลขที่นั่งสอบ": d.ExamSeat, // เพิ่มคอลัมน์นี้
                        "คำนำหน้า (นร.)": d.StudentPrefix,
                        "ชื่อ (นร.)": d.StudentFirstName,
                        "นามสกุล (นร.)": d.StudentLastName,
                        "ระดับชั้น": d.StudentGrade,
                        "โรงเรียน": d.School,
                        
                        // ปรับลำดับ: สังคม > ไทย > อังกฤษ > วิทย์ > คณิต
                        "สังคม": Number(d.Soc_Score).toFixed(2),
                        "ไทย": Number(d.Thai_Score).toFixed(2),
                        "อังกฤษ": Number(d.Eng_Score).toFixed(2),
                        "วิทย์": Number(d.Sci_Score).toFixed(2),
                        "คณิต": Number(d.Math_Score).toFixed(2),
                        
                        "คะแนนรวม": Number(d.TotalScore).toFixed(2),
                        "เกียรติบัตร": d.Certificate,
                        "คำนำหน้า (ครู)": d.AdvisorPrefix || '-',
                        "ชื่อ (ครู)": d.AdvisorFirstName || d.AdvisorName || '-',
                        "นามสกุล (ครู)": d.AdvisorLastName || d.AdvisorSurname || ''
                    }));

                    const ws = XLSX.utils.json_to_sheet(excelRows);
                    
                    // ปรับความกว้างคอลัมน์ (เพิ่มช่องสำหรับเลขที่นั่งสอบและคะแนน)
                    const wscols = [
                        {wch: 25}, {wch: 10}, {wch: 10}, {wch: 12}, // อันดับทุน, เลขที่นั่งสอบ
                        {wch: 10}, {wch: 15}, {wch: 15}, 
                        {wch: 10}, {wch: 25}, 
                        {wch: 8}, {wch: 8}, {wch: 8}, {wch: 8}, {wch: 8}, // คะแนนรายวิชา
                        {wch: 10}, {wch: 15}, 
                        {wch: 10}, {wch: 15}, {wch: 15}
                    ];
                    ws['!cols'] = wscols;

                    let sheetName = type.replace('ทุนระดับชั้นมัธยมศึกษาปีที่', 'ม.').substring(0, 30);
                    XLSX.utils.book_append_sheet(wb, ws, sheetName);
                }
            });

            if (hasData) {
                XLSX.writeFile(wb, "ผลคะแนนสอบรายบุคคล_แยกประเภททุน.xlsx");
                Swal.fire('สำเร็จ', 'ดาวน์โหลดไฟล์เรียบร้อยแล้ว', 'success');
            } else {
                Swal.fire('แจ้งเตือน', 'ไม่พบข้อมูลสำหรับดาวน์โหลด', 'warning');
            }

        } catch (e) {
            console.error(e);
            Swal.fire('Error', 'เกิดข้อผิดพลาดในการดาวน์โหลด: ' + e.message, 'error');
        } finally {
            hideLoader();
        }
    }

    // ฟังก์ชันแสดงผลสถิติคะแนนสอบ (สำหรับหน้าบ้าน - Public)
    function renderPublicExamStats() {
    console.log("🚀 เริ่มต้น renderPublicExamStats");

    // 1. ตรวจสอบ HTML Element
    const container = $('#publicOverviewTabContent');
    const tabs = $('#publicOverviewTabs');
    
    if (container.length === 0) {
        console.error("❌ ไม่พบ Element ID: publicOverviewTabContent (กรุณาเช็คไฟล์ Page_ExamStats.html และ Index.html)");
        alert("System Error: ไม่พบหน้าแสดงผล (HTML Element missing)");
        return;
    }

    // 2. ตรวจสอบข้อมูลสถิติ
    // เช็คว่า appConfig มีค่าหรือไม่ และมี stats หรือไม่
    if (!appConfig || !appConfig.stats) {
        console.error("❌ appConfig.stats เป็น undefined (กรุณา Deploy New Version ใน Code.gs)");
        container.html(`
            <div class="text-center py-5">
                <i class="bi bi-exclamation-triangle display-1 text-warning"></i>
                <h4 class="mt-3">ไม่พบข้อมูลสถิติจาก Server</h4>
                <p>กรุณาตรวจสอบว่าได้ทำการ <b>Deploy New Version</b> แล้วหรือยัง</p>
            </div>
        `);
        return;
    }

    const stats = appConfig.stats;
    const hasStats = Object.keys(stats).filter(k => k !== 'school_stats').length > 0;

    if (!hasStats) {
        container.html(`
            <div class="text-center py-5">
                <i class="bi bi-clipboard-x display-1 text-muted"></i>
                <p class="mt-3 text-muted">ยังไม่มีการประกาศผลคะแนนสอบ</p>
            </div>
        `);
        return;
    }

    // 3. เริ่มวาดกราฟ (ถ้าผ่าน 2 ข้อบนมาได้)
    container.empty();
    tabs.empty();
    
    const subjectNames = { 'Total': 'คะแนนรวม', 'Math': 'คณิต', 'Sci': 'วิทย์', 'Eng': 'อังกฤษ', 'Thai': 'ไทย', 'Soc': 'สังคม' };
    const subjectKeys = ['Total', 'Math', 'Sci', 'Eng', 'Thai', 'Soc'];
    let chartsToRender = [];
    let firstTab = true;

    Object.keys(stats).forEach((key, index) => {
        if(key === 'school_stats') return; 
        const typeName = key.replace('stats_', '');
        const data = stats[key];
        const tabId = `pub-tab-${index}`;
        
        tabs.append(`<li class="nav-item"><a class="nav-link ${firstTab ? 'active' : ''}" data-bs-toggle="tab" href="#${tabId}">${typeName}</a></li>`);

        let contentHtml = `
            <div class="tab-pane fade ${firstTab ? 'show active' : ''}" id="${tabId}">
                <div class="row g-3 mb-4 text-center">
                    <div class="col-4"><div class="p-3 bg-light border rounded"><h6>ผู้เข้าสอบ</h6><h2 class="text-primary fw-bold">${data.count.present}</h2></div></div>
                    <div class="col-4"><div class="p-3 bg-light border rounded"><h6>คะแนนเฉลี่ย</h6><h2 class="text-success fw-bold">${data.stats.Total.avg}</h2></div></div>
                    <div class="col-4"><div class="p-3 bg-light border rounded"><h6>คะแนนสูงสุด</h6><h2 class="text-danger fw-bold">${data.stats.Total.max}</h2></div></div>
                </div>
                
                <div class="card border">
                    <div class="card-header bg-light p-1">
                        <ul class="nav nav-pills card-header-pills" id="pubSubTabs-${index}">`;
                        
        subjectKeys.forEach((subj, i) => {
            contentHtml += `<li class="nav-item"><button class="nav-link btn-sm ${i===0?'active':''}" data-bs-toggle="pill" data-bs-target="#pub-pills-${index}-${subj}">${subjectNames[subj]}</button></li>`;
        });

        contentHtml += `</ul></div><div class="card-body p-3"><div class="tab-content">`;

        subjectKeys.forEach((subj, i) => {
            const chartId = `chart-pub-${index}-${subj}`;
            contentHtml += `
                <div class="tab-pane fade ${i===0?'show active':''}" id="pub-pills-${index}-${subj}">
                     <table class="table table-sm table-bordered text-center mb-3" style="font-size:0.9rem;">
                        <thead class="table-light"><tr><th>ต่ำสุด</th><th>สูงสุด</th><th>เฉลี่ย</th><th>มัธยฐาน</th><th>S.D.</th></tr></thead>
                        <tbody><tr>
                            <td>${data.stats[subj].min}</td><td>${data.stats[subj].max}</td>
                            <td class="fw-bold">${data.stats[subj].avg}</td><td>${data.stats[subj].median}</td><td>${data.stats[subj].sd}</td>
                        </tr></tbody>
                     </table>
                     <div style="height:250px"><canvas id="${chartId}"></canvas></div>
                </div>`;
            
            chartsToRender.push({ 
                id: chartId, 
                data: data.stats[subj].dist, 
                labels: subj === 'Total' ? ['0-50','51-100','101-150','151-200','201-250','251-300','301-350','351-400','401-450','451-500'] : ['0-10','11-20','21-30','31-40','41-50','51-60','61-70','71-80','81-90','91-100']
            });
        });

        contentHtml += `</div></div></div></div>`;
        container.append(contentHtml);
        firstTab = false;
    });

    // วาดกราฟ
    setTimeout(() => {
        chartsToRender.forEach(c => {
            const ctx = document.getElementById(c.id);
            if(ctx) new Chart(ctx, { 
                type: 'bar', 
                data: { labels: c.labels, datasets: [{ label: 'จำนวน (คน)', data: c.data, backgroundColor: '#36a2eb' }] }, 
                options: { maintainAspectRatio: false, plugins:{legend:{display:false}} } 
            });
        });
    }, 500);
}

// ฟังก์ชันแปลง Base64 เป็นไฟล์ PDF และดาวน์โหลด
function downloadPDF(base64Data, fileName) {
    const byteCharacters = atob(base64Data);
    const byteNumbers = new Array(byteCharacters.length);
    for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
    }
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'application/pdf' });
    
    const link = document.createElement('a');
    link.href = window.URL.createObjectURL(blob);
    link.download = fileName;
    link.click();
}

// ฟังก์ชันสำหรับปุ่มกดพิมพ์เกียรติบัตร
// (คุณต้องเอา id="btnPrintCert" ไปใส่ที่ปุ่มเกียรติบัตรใน HTML ของคุณด้วย)
$(document).on('click', '#btnPrintCert', function() {
    // ดึง ID จาก Session ที่เราเก็บไว้ตอน Login
    const citizenId = sessionStorage.getItem('applicantCitizenID');

    if(!citizenId) {
        Swal.fire('Error', 'ไม่พบข้อมูลผู้ใช้ กรุณาเข้าสู่ระบบใหม่', 'error');
        return;
    }

    Swal.fire({
        title: 'กำลังสร้างเกียรติบัตร...',
        html: 'กรุณารอสักครู่ ระบบกำลังจัดทำไฟล์ PDF<br><small>ขั้นตอนนี้อาจใช้เวลา 5-10 วินาที</small>',
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });

    google.script.run
        .withSuccessHandler(function(response) {
            if (response.success) {
                downloadPDF(response.base64, response.fileName);
                Swal.fire({
                    icon: 'success',
                    title: 'ดาวน์โหลดสำเร็จ!',
                    text: 'ไฟล์เกียรติบัตรถูกดาวน์โหลดลงในเครื่องของคุณแล้ว',
                    timer: 2000,
                    showConfirmButton: false
                });
            } else {
                Swal.fire('ไม่สามารถออกเกียรติบัตรได้', response.message, 'warning');
            }
        })
        .withFailureHandler(function(err) {
            Swal.fire('Error', err.message, 'error');
        })
        .generateCertPDF(citizenId);
});

// --- ส่วนสำหรับ Admin กดพิมพ์เกียรติบัตรให้นักเรียน ---

$(document).on('click', '.btn-admin-download-cert', function() {
    // 1. ดึงเลขบัตรประชาชนจากปุ่มที่กด (data-id)
    const targetCitizenId = $(this).data('id');

    if (!targetCitizenId) {
        Swal.fire('Error', 'ไม่พบรหัสประจำตัวผู้สมัคร', 'error');
        return;
    }

    // 2. แสดงสถานะกำลังโหลด
    Swal.fire({
        title: 'กำลังสร้างเกียรติบัตร...',
        html: `กำลังดึงข้อมูลและสร้างไฟล์ PDF สำหรับรหัส ${targetCitizenId}<br><small>กรุณารอสักครู่...</small>`,
        allowOutsideClick: false,
        didOpen: () => {
            Swal.showLoading();
        }
    });

    // 3. เรียกใช้ฟังก์ชันเดิม (generateCertPDF) แต่ส่ง ID ของนักเรียนคนนั้นไป
    google.script.run
        .withSuccessHandler(function(response) {
            if (response.success) {
                // เรียกใช้ฟังก์ชัน downloadPDF (ต้องมีฟังก์ชันนี้ในไฟล์แล้ว จากขั้นตอนก่อนหน้า)
                downloadPDF(response.base64, response.fileName);
                
                Swal.fire({
                    icon: 'success',
                    title: 'ดาวน์โหลดสำเร็จ',
                    text: 'ไฟล์เกียรติบัตรถูกส่งไปยังเครื่องของคุณแล้ว',
                    timer: 1500,
                    showConfirmButton: false
                });
            } else {
                // กรณีขาดสอบ หรือสร้างไม่ได้
                Swal.fire({
                    icon: 'warning',
                    title: 'ไม่สามารถออกเกียรติบัตรได้',
                    text: response.message
                });
            }
        })
        .withFailureHandler(function(err) {
            Swal.fire('Error', 'เกิดข้อผิดพลาด: ' + err.message, 'error');
        })
        .generateCertPDF(targetCitizenId); 
});
