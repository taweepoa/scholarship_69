<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">สถิติการสมัคร</h2>
    <button class="btn btn-outline-primary" onclick="showPage('home')"><i class="bi bi-arrow-left me-2"></i>กลับหน้าแรก</button>
</div>

<div class="row g-4 mb-4" id="stats-dashboard">
    <div class="col-md-4">
        <div class="card-dashboard shadow bg-gradient-1">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <p class="mb-0">ผู้สมัครทั้งหมด</p>
                    <h3 id="stats-total">0</h3>
                </div>
                <i class="bi bi-people-fill fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card-dashboard shadow bg-gradient-2">
             <div class="d-flex justify-content-between align-items-center">
                <div>
                    <p class="mb-0">ทุน ม.1</p>
                    <h3 id="stats-m1">0</h3>
                </div>
                <i class="bi bi-journal-album fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card-dashboard shadow bg-gradient-3">
             <div class="d-flex justify-content-between align-items-center">
                <div>
                    <p class="mb-0">ทุน ม.4</p>
                    <h3 id="stats-m4">0</h3>
                </div>
                <i class="bi bi-journal-bookmark-fill fs-1 opacity-50"></i>
            </div>
        </div>
    </div>
</div>

<div class="row g-4 mb-4">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm h-100">
            <div class="card-body text-center d-flex flex-column">
                <h6 class="card-title"><strong>ประเภททุน</strong></h6>
                <div class="flex-grow-1 d-flex align-items-center justify-content-center">
                    <canvas id="typeChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm h-100">
            <div class="card-body text-center d-flex flex-column">
                <h6 class="card-title"><strong>ระดับชั้น</strong></h6>
                <div class="flex-grow-1 d-flex align-items-center justify-content-center">
                     <canvas id="gradeChart"></canvas>
                </div>
            </div>
        </div>
    </div>
    <div class="col-12 col-lg-4">
        <div class="card shadow-sm h-100">
            <div class="card-body text-center d-flex flex-column">
                <h6 class="card-title"><strong>โรงเรียน (Top 10)</strong></h6>
                <div class="flex-grow-1" style="position: relative; min-height: 250px;">
                    <canvas id="schoolChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="card shadow-sm">
    <div class="card-header">
        <h5>รายชื่อผู้สมัคร</h5>
    </div>
    <div class="card-body">
        <div class="row g-2 mb-3" id="stats-filters">
            <div class="col-md-3">
                <input type="text" id="stats-search" class="form-control" placeholder="ค้นหาชื่อ-สกุล...">
            </div>
            <div class="col-md-3">
                <select id="stats-filter-type" class="form-select"></select>
            </div>
            <div class="col-md-3">
                <select id="stats-filter-grade" class="form-select"></select>
            </div>
            <div class="col-md-3">
                <select id="stats-filter-school" class="form-select"></select>
            </div>
        </div>
        <div class="table-responsive">
            <table id="stats-table" class="table table-striped table-hover" style="width:100%">
                <thead>
                    <tr>
                        <th>ลำดับ</th>
                        <th>ชื่อ-นามสกุล</th>
                        <th>ระดับชั้น</th>
                        <th>โรงเรียน</th>
                        <th>ประเภททุน</th>
                        <th>เลขที่นั่งสอบ</th> <th>ห้องสอบ</th>      <th>สถานะ</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>
    </div>
</div>
