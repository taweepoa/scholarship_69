<style>
    :root {
        --primary-color: #5677fc;
        --danger-color: #D32F2F;
        --warning-color: #F57C00;
        --info-color: #0288D1;
        --success-color: #388E3C;
    }
    body {
        font-family: 'Kanit', sans-serif;
        background-color: #f8f9fa;
    }
    .btn-primary { background-color: var(--primary-color); border-color: var(--primary-color); }
    .btn-primary:hover { background-color: #4a67d9; border-color: #4a67d9; }
    .text-primary { color: var(--primary-color) !important; }

    .loader-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(255, 255, 255, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.3s;
    }
    .page-content {
        animation: fadeIn 0.5s;
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }
    
    .card-dashboard {
        border: none;
        border-radius: 15px;
        color: white;
        padding: 20px;
        transition: transform 0.2s;
    }
    .card-dashboard:hover {
        transform: translateY(-5px);
    }
    .card-dashboard h3 {
        font-size: 2.5rem;
        font-weight: 700;
    }
    .bg-gradient-1 { background: linear-gradient(45deg, #5677fc, #0288D1); }
    .bg-gradient-2 { background: linear-gradient(45deg, #F57C00, #FBC02D); }
    .bg-gradient-3 { background: linear-gradient(45deg, #D32F2F, #F57C00); }
    .bg-gradient-4 { background: linear-gradient(45deg, #388E3C, #8BC34A); }
    .bg-gradient-5 { background: linear-gradient(45deg, #673AB7, #3F51B5); }


    #admin-fab {
        position: fixed;
        bottom: 20px;
        right: 20px;
        width: 60px;
        height: 60px;
        font-size: 1.5rem;
        z-index: 1050;
    }
    
    .modal-header {
      background-color: var(--primary-color);
      color: white;
    }
    .modal-header .btn-close {
      filter: invert(1) grayscale(100%) brightness(200%);
    }

    .form-step {
      display: none;
    }
    .form-step.active {
      display: block;
    }

    .drop-zone {
      border: 2px dashed #ccc;
      border-radius: 10px;
      padding: 25px;
      text-align: center;
      cursor: pointer;
      background-color: #f9f9f9;
      transition: background-color 0.2s;
    }
    .drop-zone.dragover {
      background-color: #e9e9e9;
      border-color: var(--primary-color);
    }
    .drop-zone-text {
        font-weight: 500;
        color: #555;
    }
    #preview-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 15px;
    }
    .preview-item {
        position: relative;
    }
    .preview-item img {
        width: 100px;
        height: 100px;
        object-fit: cover;
        border-radius: 5px;
    }
    .preview-item .remove-file {
        position: absolute;
        top: -5px;
        right: -5px;
        background: var(--danger-color);
        color: white;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        line-height: 1;
    }

    .table-responsive {
        overflow-x: auto;
    }
    .dataTables_wrapper .dataTables_paginate .page-item.active .page-link {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
    }

    header .navbar.container {
      padding-left: calc(var(--bs-gutter-x) * .5);
      padding-right: calc(var(--bs-gutter-x) * .5);
    }

</style>
